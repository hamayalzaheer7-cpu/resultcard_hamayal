<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>STUDENT RESULT</header>

    <main>
        <h1>Result Calculator</h1>
        <p class="subtitle">Calculate your academic performance.</p>

        <form onsubmit="showResult(event)">
            <h3>01 — Student Details</h3>

            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter full name" required>

            <h3>02 — Subject Marks</h3>
            <p class="hint">Enter marks out of 100</p>

            <div class="subject">
                <label for="english">English</label>
                <input type="number" id="english" required>
            </div>

            <div class="subject">
                <label for="urdu">Urdu</label>
                <input type="number" id="urdu"  required>
            </div>

            <div class="subject">
                <label for="math">Mathematics</label>
                <input type="number" id="math" required>
            </div>

            <button type="submit">View Result →</button>
        </form>

        <section id="result"></section>
    </main>

    <footer>ACADEMIC RECORDS · STUDENT RESULT SYSTEM</footer>

    <script src="script.js"></script>
</body>
</html>
